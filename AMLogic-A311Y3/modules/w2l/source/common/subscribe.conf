[subscribe]
#publish id
subscribe_id=0

#subscribe type
#2: NAN_SUBSCRIBE_ACTIVE   Send broadcast Subscribe frames in every DW
#3: NAN_SUBSCRIBE_PASSIVE  Passively listens to Publish frames
subscribe_type=2

#service name, max len 32
service_name=nan_test

#service info, max len 255
service_specific_info=hello!

#match_filter_tx <len,vlaue> pairs, max len+val 64
match_filter_tx=<2,1,3>

#match_filter_rx <len,vlaue> pairs, max len+val 64
match_filter_rx=<2,1,1><1,2>

#service response filter(srf)
#srf type
#0: lists MAC addresses
#1: Bloom filter
srf_type=1

#srf include
#0: Not include
#1: include
srf_include=1

#Bloom filter length
srf_bf_len=40

#Bloom filter index
srf_bf_idx=0

#srf mac address num
srf_num_macs=8

#srf mac addresses
srf_mac0=00:60:2F:BF:5B:92
srf_mac1=00:60:2F:CA:EC:BD
srf_mac2=00:60:2F:95:06:4B
srf_mac3=00:60:2F:76:7C:A5
srf_mac4=00:60:2F:3A:1E:03
srf_mac5=00:60:2F:FE:9E:6A
srf_mac6=00:60:2F:29:A5:5F
srf_mac7=00:60:2F:C3:77:E5
